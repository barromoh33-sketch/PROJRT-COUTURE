<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horloge Digitale Multi-Fuseaux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* ============================================
           CONTROLS
           ============================================ */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .control-group label {
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }

        .control-group select,
        .control-group input {
            padding: 10px 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .control-group input {
            cursor: pointer;
        }

        .control-group select:hover,
        .control-group input:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
        }

        .control-group select option {
            background: #1e3c72;
            color: white;
        }

        /* ============================================
           CLOCKS GRID
           ============================================ */
        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* ============================================
           CLOCK CARD
           ============================================ */
        .clock-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(240,240,255,0.95) 100%);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.8);
        }

        .clock-card.night {
            background: linear-gradient(135deg, rgba(30,60,114,0.95) 0%, rgba(42,82,152,0.95) 100%);
            color: white;
        }

        .clock-card.night .timezone {
            color: rgba(255,255,255,0.8);
        }

        .clock-card.night .date-info {
            color: rgba(255,255,255,0.7);
        }

        /* Animation de fond */
        .clock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        .timezone {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1;
            position: relative;
        }

        .timezone-offset {
            font-size: 12px;
            color: #666;
            margin-left: 10px;
            opacity: 0.8;
        }

        .clock-card.night .timezone-offset {
            color: rgba(255,255,255,0.6);
        }

        /* ============================================
           DIGITAL DISPLAY
           ============================================ */
        .digital-display {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3f 100%);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            border: 3px solid #00ff88;
            box-shadow: 0 0 20px rgba(0,255,136,0.3), inset 0 0 20px rgba(0,255,136,0.1);
            position: relative;
            overflow: hidden;
        }

        .digital-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,136,0.1), transparent);
            animation: scan 3s infinite;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .time {
            font-size: 48px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0,255,136,0.8);
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            z-index: 1;
            position: relative;
            text-align: center;
        }

        .time-period {
            font-size: 16px;
            color: #00ff88;
            opacity: 0.8;
            margin-top: 8px;
            text-align: center;
        }

        /* ============================================
           ANALOG CLOCK
           ============================================ */
        .analog-clock-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .analog-clock {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0f0ff 0%, #e0e0ff 100%);
            border: 6px solid #333;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.5);
        }

        .clock-card.night .analog-clock {
            background: linear-gradient(135deg, #1a1a3f 0%, #2a2a4f 100%);
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0,255,136,0.3), inset 0 2px 5px rgba(0,255,136,0.1);
        }

        .center-dot {
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .clock-card.night .center-dot {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.8);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 40px;
            background: #333;
            margin-left: -3px;
        }

        .minute-hand {
            width: 4px;
            height: 50px;
            background: #666;
            margin-left: -2px;
        }

        .second-hand {
            width: 2px;
            height: 55px;
            background: #ff4444;
            margin-left: -1px;
        }

        .clock-card.night .hour-hand {
            background: #00ff88;
        }

        .clock-card.night .minute-hand {
            background: #00ccff;
        }

        .clock-card.night .second-hand {
            background: #ff6688;
        }

        /* ============================================
           DATE & INFO
           ============================================ */
        .date-info {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .date-info div {
            margin: 5px 0;
        }

        .date-label {
            font-weight: 600;
            color: #333;
        }

        .clock-card.night .date-label {
            color: rgba(255,255,255,0.9);
        }

        /* ============================================
           ADD TIMEZONE BUTTON
           ============================================ */
        .add-timezone-container {
            text-align: center;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(102,126,234,0.3);
        }

        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102,126,234,0.4);
        }

        .btn-remove {
            background: rgba(255,0,0,0.1);
            border: 2px solid #ff4444;
            color: #ff4444;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .btn-remove:hover {
            background: rgba(255,0,0,0.2);
            transform: scale(1.05);
        }

        .clock-card.night .btn-remove {
            border-color: #ff6688;
            color: #ff6688;
        }

        /* ============================================
           MODAL
           ============================================ */
        .modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-body {
            margin-bottom: 30px;
        }

        .timezone-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .timezone-list li {
            padding: 12px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .timezone-list li:hover {
            background: #e8e8e8;
            border-left-color: #667eea;
            transform: translateX(5px);
        }

        .timezone-list li.selected {
            background: #667eea;
            color: white;
            border-left-color: #764ba2;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-modal {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-confirm {
            background: #667eea;
            color: white;
        }

        .btn-confirm:hover {
            background: #764ba2;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .time {
                font-size: 36px;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .control-group select {
                flex: 1;
            }
        }

        /* ============================================
           KEYBOARD INDICATOR
           ============================================ */
        .keyboard-hint {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-top: 20px;
        }

        /* ============================================
           UTILITAIRES
           ============================================ */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .timezone-list {
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,0.2) transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>⏰ Horloge Mondiale</h1>
            <p>Suivi du temps en temps réel dans différents fuseaux horaires</p>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="control-group">
                <label for="format-toggle">Format:</label>
                <select id="format-toggle" onchange="changeFormat()">
                    <option value="24">24h</option>
                    <option value="12">12h (AM/PM)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="display-toggle">Affichage:</label>
                <select id="display-toggle" onchange="changeDisplay()">
                    <option value="digital">Numérique 🔢</option>
                    <option value="analog">Analogique ⏱️</option>
                    <option value="both">Les Deux 🔢⏱️</option>
                </select>
            </div>

            <div class="control-group">
                <label for="theme-toggle">Thème:</label>
                <input type="checkbox" id="theme-toggle" onchange="toggleTheme()" title="Basculer jour/nuit">
                <label for="theme-toggle" style="margin-top: 0; margin-left: 8px;">Nuit 🌙</label>
            </div>
        </div>

        <!-- CLOCKS GRID -->
        <div class="clocks-grid" id="clocks-grid">
            <!-- Horloges générées dynamiquement -->
        </div>

        <!-- ADD TIMEZONE BUTTON -->
        <div class="add-timezone-container">
            <button class="btn-add" onclick="openAddTimezoneModal()">➕ Ajouter un Fuseau Horaire</button>
        </div>

        <!-- KEYBOARD HINT -->
        <div class="keyboard-hint">
            💡 Conseil: Cliquez sur une horloge et appuyez sur "Supprimer" pour la retirer, ou "+" pour en ajouter une nouvelle
        </div>
    </div>

    <!-- MODAL ADD TIMEZONE -->
    <div id="addTimezoneModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">🌍 Ajouter un Fuseau Horaire</div>
            <div class="modal-body">
                <input type="text" id="timezone-search" placeholder="Rechercher un fuseau horaire..." 
                       style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 15px; font-size: 14px;">
                <ul class="timezone-list scrollbar-hide" id="timezone-list">
                    <!-- Fuseaux horaires générés dynamiquement -->
                </ul>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-cancel" onclick="closeAddTimezoneModal()">Annuler</button>
                <button class="btn-modal btn-confirm" onclick="confirmAddTimezone()">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // Liste des fuseaux horaires
        const TIMEZONES = [
            // Afrique
            { name: 'Dakar, Sénégal', tz: 'Africa/Dakar', emoji: '🇸🇳' },
            { name: 'Casablanca, Maroc', tz: 'Africa/Casablanca', emoji: '🇲🇦' },
            { name: 'Lagos, Nigeria', tz: 'Africa/Lagos', emoji: '🇳🇬' },
            { name: 'Johannesburg, Afrique du Sud', tz: 'Africa/Johannesburg', emoji: '🇿🇦' },
            { name: 'Le Caire, Égypte', tz: 'Africa/Cairo', emoji: '🇪🇬' },

            // Europe
            { name: 'Londres, Royaume-Uni', tz: 'Europe/London', emoji: '🇬🇧' },
            { name: 'Paris, France', tz: 'Europe/Paris', emoji: '🇫🇷' },
            { name: 'Berlin, Allemagne', tz: 'Europe/Berlin', emoji: '🇩🇪' },
            { name: 'Madrid, Espagne', tz: 'Europe/Madrid', emoji: '🇪🇸' },
            { name: 'Rome, Italie', tz: 'Europe/Rome', emoji: '🇮🇹' },
            { name: 'Amsterdam, Pays-Bas', tz: 'Europe/Amsterdam', emoji: '🇳🇱' },
            { name: 'Moscou, Russie', tz: 'Europe/Moscow', emoji: '🇷🇺' },
            { name: 'Istanbul, Turquie', tz: 'Europe/Istanbul', emoji: '🇹🇷' },

            // Asie
            { name: 'Dubai, Émirats', tz: 'Asia/Dubai', emoji: '🇦🇪' },
            { name: 'Bangalore, Inde', tz: 'Asia/Kolkata', emoji: '🇮🇳' },
            { name: 'Bangkok, Thaïlande', tz: 'Asia/Bangkok', emoji: '🇹🇭' },
            { name: 'Singapour', tz: 'Asia/Singapore', emoji: '🇸🇬' },
            { name: 'Hong Kong', tz: 'Asia/Hong_Kong', emoji: '🇭🇰' },
            { name: 'Shanghai, Chine', tz: 'Asia/Shanghai', emoji: '🇨🇳' },
            { name: 'Tokyo, Japon', tz: 'Asia/Tokyo', emoji: '🇯🇵' },
            { name: 'Séoul, Corée', tz: 'Asia/Seoul', emoji: '🇰🇷' },
            { name: 'Sydney, Australie', tz: 'Australia/Sydney', emoji: '🇦🇺' },

            // Amérique
            { name: 'New York, USA', tz: 'America/New_York', emoji: '🗽' },
            { name: 'Los Angeles, USA', tz: 'America/Los_Angeles', emoji: '🌊' },
            { name: 'Chicago, USA', tz: 'America/Chicago', emoji: '🏙️' },
            { name: 'Mexico City, Mexique', tz: 'America/Mexico_City', emoji: '🇲🇽' },
            { name: 'Toronto, Canada', tz: 'America/Toronto', emoji: '🇨🇦' },
            { name: 'São Paulo, Brésil', tz: 'America/Sao_Paulo', emoji: '🇧🇷' },
            { name: 'Buenos Aires, Argentine', tz: 'America/Argentina/Buenos_Aires', emoji: '🇦🇷' },

            // UTC
            { name: 'UTC (Temps Universel)', tz: 'UTC', emoji: '🌍' },
        ];

        // Variables globales
        let selectedTimezones = ['Africa/Dakar', 'Europe/Paris', 'Asia/Tokyo', 'America/New_York'];
        let timeFormat = '24';
        let displayMode = 'digital';
        let nightMode = false;
        let selectedTimezoneForAdd = null;

        // Initialiser
        function init() {
            renderClocks();
            updateClocks();
            setInterval(updateClocks, 1000);
            loadTimezoneList();
        }

        // Rendre les horloges
        function renderClocks() {
            const grid = document.getElementById('clocks-grid');
            grid.innerHTML = '';

            selectedTimezones.forEach((tz, index) => {
                const tzData = TIMEZONES.find(t => t.tz === tz);
                const card = document.createElement('div');
                card.className = `clock-card ${nightMode ? 'night' : ''}`;
                card.innerHTML = `
                    <button class="btn-remove" onclick="removeTimezone('${tz}')">✕ Retirer</button>
                    
                    <div class="timezone">
                        ${tzData?.emoji || '🕐'} ${tzData?.name || tz}
                        <span class="timezone-offset" id="offset-${index}"></span>
                    </div>

                    ${displayMode === 'digital' || displayMode === 'both' ? `
                        <div class="digital-display">
                            <div class="time" id="time-${index}">--:--:--</div>
                            <div class="time-period" id="period-${index}"></div>
                        </div>
                    ` : ''}

                    ${displayMode === 'analog' || displayMode === 'both' ? `
                        <div class="analog-clock-container">
                            <div class="analog-clock">
                                <div class="hand hour-hand" id="hour-${index}"></div>
                                <div class="hand minute-hand" id="minute-${index}"></div>
                                <div class="hand second-hand" id="second-${index}"></div>
                                <div class="center-dot"></div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="date-info">
                        <div><span class="date-label">Date:</span> <span id="date-${index}">--/--/----</span></div>
                        <div><span class="date-label">Jour:</span> <span id="day-${index}">---</span></div>
                        <div><span class="date-label">Heure UTC:</span> <span id="utc-${index}">--:--:--</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Mettre à jour les horloges
        function updateClocks() {
            selectedTimezones.forEach((tz, index) => {
                const date = new Date().toLocaleString('fr-FR', { timeZone: tz });
                const parts = new Date(date);
                
                // Heure locale
                const hours = parts.getHours();
                const minutes = parts.getMinutes();
                const seconds = parts.getSeconds();

                // Affichage numérique
                if (displayMode === 'digital' || displayMode === 'both') {
                    let timeDisplay = '';
                    let periodDisplay = '';

                    if (timeFormat === '24') {
                        timeDisplay = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    } else {
                        const hrs = hours % 12 || 12;
                        timeDisplay = `${String(hrs).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        periodDisplay = hours >= 12 ? 'PM' : 'AM';
                    }

                    const timeElement = document.getElementById(`time-${index}`);
                    const periodElement = document.getElementById(`period-${index}`);
                    if (timeElement) timeElement.textContent = timeDisplay;
                    if (periodElement) periodElement.textContent = periodDisplay;
                }

                // Affichage analogique
                if (displayMode === 'analog' || displayMode === 'both') {
                    const hourHand = document.getElementById(`hour-${index}`);
                    const minuteHand = document.getElementById(`minute-${index}`);
                    const secondHand = document.getElementById(`second-${index}`);

                    if (hourHand) hourHand.style.transform = `rotate(${(hours % 12) * 30 + minutes * 0.5}deg)`;
                    if (minuteHand) minuteHand.style.transform = `rotate(${minutes * 6 + seconds * 0.1}deg)`;
                    if (secondHand) secondHand.style.transform = `rotate(${seconds * 6}deg)`;
                }

                // Date et infos
                const dateElement = document.getElementById(`date-${index}`);
                const dayElement = document.getElementById(`day-${index}`);
                const utcElement = document.getElementById(`utc-${index}`);
                const offsetElement = document.getElementById(`offset-${index}`);

                if (dateElement) {
                    const localDate = new Date();
                    const tzDate = new Date(localDate.toLocaleString('en-US', { timeZone: tz }));
                    dateElement.textContent = tzDate.toLocaleDateString('fr-FR');
                }

                if (dayElement) {
                    const days = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
                    const tzDate = new Date(new Date().toLocaleString('en-US', { timeZone: tz }));
                    dayElement.textContent = days[tzDate.getDay()];
                }

                if (utcElement) {
                    const utcDate = new Date();
                    utcElement.textContent = utcDate.toLocaleTimeString('fr-FR', { timeZone: 'UTC' });
                }

                if (offsetElement) {
                    const utcDate = new Date();
                    const tzDate = new Date(utcDate.toLocaleString('en-US', { timeZone: tz }));
                    const offset = (tzDate - utcDate) / (1000 * 60 * 60);
                    const sign = offset >= 0 ? '+' : '-';
                    offsetElement.textContent = `(UTC${sign}${Math.abs(offset).toFixed(0)})`;
                }
            });
        }

        // Changer le format
        function changeFormat() {
            timeFormat = document.getElementById('format-toggle').value;
            renderClocks();
            updateClocks();
        }

        // Changer l'affichage
        function changeDisplay() {
            displayMode = document.getElementById('display-toggle').value;
            renderClocks();
            updateClocks();
        }

        // Basculer le thème
        function toggleTheme() {
            nightMode = document.getElementById('theme-toggle').checked;
            renderClocks();
            updateClocks();
        }

        // Ouvrir le modal
        function openAddTimezoneModal() {
            document.getElementById('addTimezoneModal').classList.add('show');
        }

        // Fermer le modal
        function closeAddTimezoneModal() {
            document.getElementById('addTimezoneModal').classList.remove('show');
            selectedTimezoneForAdd = null;
        }

        // Charger la liste des fuseaux horaires
        function loadTimezoneList() {
            const list = document.getElementById('timezone-list');
            list.innerHTML = '';

            TIMEZONES.forEach(tz => {
                const li = document.createElement('li');
                if (selectedTimezones.includes(tz.tz)) {
                    li.classList.add('selected');
                }
                li.innerHTML = `${tz.emoji} ${tz.name}`;
                li.onclick = () => {
                    selectedTimezoneForAdd = tz.tz;
                    document.querySelectorAll('#timezone-list li').forEach(item => {
                        item.classList.remove('selected');
                    });
                    li.classList.add('selected');
                };
                list.appendChild(li);
            });
        }

        // Rechercher des fuseaux horaires
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('timezone-search');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    const list = document.getElementById('timezone-list');
                    const items = list.querySelectorAll('li');

                    items.forEach(item => {
                        const text = item.textContent.toLowerCase();
                        item.style.display = text.includes(query) ? 'block' : 'none';
                    });
                });
            }
        });

        // Ajouter un fuseau horaire
        function confirmAddTimezone() {
            if (selectedTimezoneForAdd && !selectedTimezones.includes(selectedTimezoneForAdd)) {
                selectedTimezones.push(selectedTimezoneForAdd);
                renderClocks();
                updateClocks();
                closeAddTimezoneModal();
            }
        }

        // Retirer un fuseau horaire
        function removeTimezone(tz) {
            selectedTimezones = selectedTimezones.filter(t => t !== tz);
            renderClocks();
            updateClocks();
        }

        // Initialiser l'app
        init();

        // Fermer le modal si on clique en dehors
        window.onclick = (event) => {
            const modal = document.getElementById('addTimezoneModal');
            if (event.target === modal) {
                closeAddTimezoneModal();
            }
        };
    </script>
</body>
</html>
